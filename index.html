<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Partners Roster — Employee Database</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Lora:ital@1&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#1A8C8C; --teal-dark:#136969; --teal-ink:#136969; --teal-light:#E6F7F7;
  --gold:#F0A520; --gold-dark:#C8861A; --gold-ink:#A86F12; --gold-light:#FEF6E4;
  --warm:#8B7D6B; --warm-light:#F4EFE9;
  --dark:#1A2E3B; --mid:#4A5A66; --muted:#7A8A96;
  --border:#E0E8EC; --card:#FFFFFF; --offwhite:#F7F9FA; --surface:#EFF4F7;
  --line-soft:#eef3f5; --dash:#e6eef1; --gray-bg:#eef3f5; --green-bg:#e3f4ec; --red-bg:#fbe9e9; --red-line:#f0cccc; --empty-v:#b3c0c8;
  --green:#2E9E6B; --red:#D94F4F;
  --sidebar:#16262F; --sidebar-hover:#20323d;
  --shadow-sm:0 1px 2px rgba(26,46,59,.06),0 1px 3px rgba(26,46,59,.08);
  --shadow-md:0 4px 12px rgba(26,46,59,.10);
  --shadow-lg:0 12px 40px rgba(26,46,59,.22);
  --r:10px; --r-sm:7px;
  --ff-disp:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --ff-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ff-serif:'Lora',Georgia,serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --teal-ink:#7fd6d6; --teal-light:#123536; --gold-ink:#f2c26a; --gold-light:#3a2e14; --warm-light:#2e2924;
    --dark:#E6EEF2; --mid:#B4C2CB; --muted:#8696A2; --border:#2A3B47; --card:#17242D; --offwhite:#0F1A21; --surface:#1C2B35;
    --line-soft:#22323d; --dash:#26363f; --gray-bg:#22323d; --green-bg:#143326; --red-bg:#3a1c1c; --red-line:#5a2a2a; --empty-v:#5d6e7a;
    --sidebar:#0B141A; --sidebar-hover:#16232c;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 4px 12px rgba(0,0,0,.4); --shadow-lg:0 12px 40px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --teal-ink:#7fd6d6; --teal-light:#123536; --gold-ink:#f2c26a; --gold-light:#3a2e14; --warm-light:#2e2924;
  --dark:#E6EEF2; --mid:#B4C2CB; --muted:#8696A2; --border:#2A3B47; --card:#17242D; --offwhite:#0F1A21; --surface:#1C2B35;
  --line-soft:#22323d; --dash:#26363f; --gray-bg:#22323d; --green-bg:#143326; --red-bg:#3a1c1c; --red-line:#5a2a2a; --empty-v:#5d6e7a;
  --sidebar:#0B141A; --sidebar-hover:#16232c;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 4px 12px rgba(0,0,0,.4); --shadow-lg:0 12px 40px rgba(0,0,0,.55);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--ff-body);color:var(--dark);background:var(--offwhite);
  -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:45;background:var(--card)}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--dark)}
a{color:var(--teal);text-decoration:none}
code{font-size:12.5px;background:var(--surface);padding:1px 5px;border-radius:4px}
h1,h2,h3,h4{margin:0;font-family:var(--ff-disp);font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--dark)}
img{max-width:100%}

.btn{border:none;border-radius:var(--r-sm);padding:9px 16px;font-weight:600;font-size:14px;
  display:inline-flex;align-items:center;gap:7px;transition:.15s;white-space:nowrap}
.btn-primary{background:var(--teal);color:#fff}
.btn-primary:hover{background:var(--teal-dark)}
.btn-ghost{background:transparent;color:var(--mid);border:1.5px solid var(--border)}
.btn-ghost:hover{border-color:var(--teal);color:var(--teal)}
.btn-danger{background:transparent;color:var(--red);border:1.5px solid var(--red-line)}
.btn-danger:hover{background:var(--red);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

.shell{display:flex;min-height:100%}
.sidebar{width:238px;background:var(--sidebar);color:#cdd8de;flex-shrink:0;display:flex;flex-direction:column;
  position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.sb-brand{padding:20px 20px 16px;display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(255,255,255,.07)}
.sb-brand .nm{font-family:var(--ff-disp);font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#fff;font-size:18px;line-height:1}
.sb-brand .nm small{display:block;font-size:10.5px;letter-spacing:2px;color:#4fb8b8;font-weight:600;margin-top:3px}
.sb-nav{padding:14px 12px;flex:1;overflow-y:auto}
.sb-eyebrow{font-family:var(--ff-disp);text-transform:uppercase;letter-spacing:2px;font-size:10.5px;color:#5f7883;font-weight:700;padding:12px 12px 7px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--r-sm);color:#b7c6ce;font-weight:500;font-size:14.5px;cursor:pointer;transition:.13s;margin-bottom:2px}
.nav-item:hover{background:var(--sidebar-hover);color:#fff}
.nav-item.active{background:var(--teal);color:#fff;font-weight:600}
.nav-item .ct{margin-left:auto;background:rgba(255,255,255,.12);border-radius:20px;font-size:11px;padding:1px 8px;font-weight:600}
.sb-foot{padding:14px 16px;border-top:1px solid rgba(255,255,255,.07);font-size:11px;color:#6d8691}
.sb-foot .tag{font-family:var(--ff-serif);font-style:italic;color:#4fb8b8;font-size:13px}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:13px 26px;display:flex;align-items:center;gap:16px;
  position:sticky;top:env(safe-area-inset-top,0px);z-index:40}
.search-wrap{flex:1;max-width:520px;position:relative}
.search-wrap .si{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);display:flex}
.search-in{width:100%;padding:10px 12px 10px 38px;border:1.5px solid var(--border);border-radius:var(--r);background:var(--offwhite);outline:none;transition:.15s}
.search-in:focus{border-color:var(--teal);background:var(--card)}
.topbar-sp{flex:1}
.icon-btn{width:38px;height:38px;border-radius:var(--r-sm);border:1.5px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--mid)}
.icon-btn:hover{border-color:var(--teal);color:var(--teal)}
.page{padding:26px;max-width:1400px;width:100%;margin:0 auto}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;gap:16px;flex-wrap:wrap}
.page-head h1{font-size:30px;letter-spacing:.5px}
.page-head .eyebrow{font-family:var(--ff-disp);text-transform:uppercase;letter-spacing:2.5px;font-size:11px;color:var(--teal);font-weight:700;margin-bottom:4px}
.page-head .sub{color:var(--muted);font-size:13.5px;margin-top:3px}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:14px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px 17px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;cursor:pointer;transition:.15s}
.stat:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--teal)}
.stat.gold::before{background:var(--gold)} .stat.warm::before{background:var(--warm)}
.stat.alert::before{background:var(--red)} .stat.green::before{background:var(--green)}
.stat .k{font-family:var(--ff-disp);text-transform:uppercase;letter-spacing:1.2px;font-size:11.5px;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--ff-disp);font-weight:800;font-size:36px;line-height:1;color:var(--dark);margin-top:6px}
.dash-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:900px){.dash-cols{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-sm)}
.card-h{padding:15px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-h h3{font-size:16px}
.card-h .eyebrow{font-family:var(--ff-disp);text-transform:uppercase;letter-spacing:2px;font-size:10px;color:var(--teal);font-weight:700}
.mini-list{padding:6px 0}
.mini-row{display:flex;align-items:center;gap:12px;padding:9px 18px;cursor:pointer}
.mini-row:hover{background:var(--offwhite)}
.mini-row .nm{font-weight:600;font-size:14px}
.mini-row .mt{color:var(--muted);font-size:12.5px;margin-left:auto;text-align:right}

.av{border-radius:50%;background:var(--teal-light);color:var(--teal-ink);display:flex;align-items:center;justify-content:center;font-family:var(--ff-disp);font-weight:700;text-transform:uppercase;flex-shrink:0;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av.ring{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--gold)}
.av-32{width:32px;height:32px;font-size:12px}
.av-96{width:96px;height:96px;font-size:32px}

.filterbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:14px}
.fsel{padding:8px 11px;border:1.5px solid var(--border);border-radius:var(--r-sm);background:var(--card);color:var(--mid);font-size:13.5px;outline:none;cursor:pointer;max-width:170px}
.fsel:focus{border-color:var(--teal)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:20px;border:1.5px solid var(--border);background:var(--card);font-size:13px;color:var(--mid);cursor:pointer}
.chip:hover{border-color:var(--teal)}
.chip.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.chip.on.gold{background:var(--gold);border-color:var(--gold);color:#3a2a05}
.grid-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow-sm)}
.grid-scroll{overflow-x:auto}
table.roster{width:100%;border-collapse:collapse;min-width:900px}
.roster thead th{background:var(--surface);text-align:left;padding:11px 14px;font-family:var(--ff-disp);text-transform:uppercase;letter-spacing:.8px;font-size:11.5px;color:var(--mid);font-weight:700;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none}
.roster thead th:hover{color:var(--teal)}
.roster thead th .ar{opacity:.4;margin-left:3px}
.roster tbody td{padding:11px 14px;border-bottom:1px solid var(--line-soft);font-size:13.5px;vertical-align:middle}
.roster tbody tr{cursor:pointer}
.roster tbody tr:hover{background:var(--teal-light)}
.cell-nm{display:flex;align-items:center;gap:10px}
.cell-nm .nm{font-weight:600}
.cell-nm .em{font-size:11.5px;color:var(--muted)}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;font-family:var(--ff-disp);text-transform:uppercase;letter-spacing:.5px}
.b-teal{background:var(--teal-light);color:var(--teal-ink)}
.b-gold{background:var(--gold-light);color:var(--gold-ink)}
.b-warm{background:var(--warm-light);color:var(--warm)}
.b-green{background:var(--green-bg);color:var(--green)}
.b-red{background:var(--red-bg);color:var(--red)}
.b-gray{background:var(--gray-bg);color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.grid-foot{padding:11px 16px;color:var(--muted);font-size:13px;border-top:1px solid var(--border);display:flex;justify-content:space-between}
.empty{padding:56px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--mid);font-size:18px;margin-bottom:6px}

.scrim{position:fixed;inset:0;background:rgba(10,20,28,.5);z-index:100;animation:fade .18s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:640px;max-width:96vw;background:var(--offwhite);z-index:101;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:slidein .24s cubic-bezier(.2,.7,.3,1)}
@keyframes slidein{from{transform:translateX(40px);opacity:.4}to{transform:translateX(0);opacity:1}}
.dr-head{background:linear-gradient(135deg,#16262F,#1A2E3B 70%,#154545);color:#fff;padding:22px 24px 18px;display:flex;gap:16px;align-items:flex-start;position:relative}
.dr-head .close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.13);border:none;color:#fff;width:32px;height:32px;border-radius:8px;font-size:17px}
.dr-head h2{color:#fff;font-size:25px}
.dr-head .role{color:#8fd6d6;font-weight:500;font-size:14px;margin-top:3px}
.dr-head .idpill{margin-top:8px;display:inline-block;background:rgba(255,255,255,.12);padding:2px 10px;border-radius:6px;font-size:12px;font-family:var(--ff-disp);letter-spacing:1px}
.dr-tabs{display:flex;gap:2px;background:var(--card);border-bottom:1px solid var(--border);padding:0 14px;overflow-x:auto}
.dr-tab{padding:12px 13px;font-family:var(--ff-disp);text-transform:uppercase;letter-spacing:.7px;font-size:12.5px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap;cursor:pointer}
.dr-tab.active{color:var(--teal);border-bottom-color:var(--teal)}
.dr-body{flex:1;overflow-y:auto;padding:22px 24px 40px}
.dr-actions{padding:14px 24px;background:var(--card);border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}
.fld-row{display:grid;grid-template-columns:150px 1fr;gap:14px;padding:9px 0;border-bottom:1px dashed var(--dash);align-items:baseline}
.fld-row .k{font-family:var(--ff-disp);text-transform:uppercase;letter-spacing:.7px;font-size:11.5px;color:var(--muted);font-weight:700}
.fld-row .val{font-size:14.5px;word-break:break-word}
.empty-v{color:var(--empty-v);font-style:italic}
.sec-title{font-family:var(--ff-disp);text-transform:uppercase;letter-spacing:1.5px;font-size:12px;color:var(--teal);font-weight:700;margin:22px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--teal-light)}
.sec-title:first-child{margin-top:0}
.prod-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px}
.prod-box{background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);padding:14px 16px}
.prod-box .yr{font-family:var(--ff-disp);letter-spacing:1px;color:var(--muted);font-size:12px;text-transform:uppercase;font-weight:700}
.prod-box .amt{font-family:var(--ff-disp);font-weight:800;font-size:26px;margin-top:4px}
.prod-box .un{color:var(--teal-ink);font-size:13px;font-weight:600;margin-top:2px}
.check-list{list-style:none;padding:0;margin:0}
.check-list li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--dash);font-size:14px}
.check-list .cbox{width:20px;height:20px;border-radius:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px}
.check-list .done{background:var(--green);color:#fff}
.check-list .todo{background:var(--gray-bg);border:1px solid var(--border)}
.tags{display:flex;flex-wrap:wrap;gap:6px}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.form-grid.one{grid-template-columns:1fr}
.ss-wrap{position:relative}
.ss-menu{position:absolute;z-index:60;left:0;right:0;top:calc(100% + 4px);background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);box-shadow:var(--shadow-md);max-height:260px;overflow:auto}
.ss-opt{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line-soft)}
.ss-opt:hover{background:var(--surface)}
.ss-lb{font-weight:600;font-size:14px}
.ss-sub{font-size:12px;color:var(--muted)}
@media(max-width:560px){.form-grid{grid-template-columns:1fr}}
.f-label{font-family:var(--ff-disp);text-transform:uppercase;letter-spacing:.7px;font-size:11px;color:var(--mid);font-weight:700;display:block;margin-bottom:5px}
.f-in{width:100%;padding:9px 11px;border:1.5px solid var(--border);border-radius:var(--r-sm);outline:none;background:var(--card)}
.f-in:focus{border-color:var(--teal)}
textarea.f-in{resize:vertical;min-height:66px}
.photo-up{display:flex;align-items:center;gap:16px;margin-bottom:18px;padding:16px;background:var(--card);border:1px dashed var(--border);border-radius:var(--r)}
.tog{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px dashed var(--dash);cursor:pointer}
.tog .sw{width:40px;height:23px;border-radius:20px;background:var(--border);position:relative;transition:.15s;flex-shrink:0}
.tog .sw.on{background:var(--teal)}
.tog .sw::after{content:"";position:absolute;top:2.5px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tog .sw.on::after{left:19px}
.tog .lbl{font-size:14px;font-weight:500}

.org-scroll{overflow:auto;padding:18px 6px 6px}
.org-treewrap{display:flex;flex-direction:column;align-items:center;gap:30px;width:max-content;min-width:100%}
.org-tree,.org-tree ul{display:flex;justify-content:center;list-style:none;padding:0;margin:0}
.org-tree ul{padding-top:26px;position:relative}
.org-tree li{list-style:none;position:relative;padding:26px 12px 0;text-align:center}
.org-tree li::before,.org-tree li::after{content:"";position:absolute;top:0;right:50%;width:50%;height:26px;border-top:2px solid var(--border)}
.org-tree li::after{right:auto;left:50%;border-left:2px solid var(--border)}
.org-tree li:only-child::before,.org-tree li:only-child::after{display:none}
.org-tree li:only-child{padding-top:0}
.org-tree li:first-child::before,.org-tree li:last-child::after{border:0 none}
.org-tree li:last-child::before{border-right:2px solid var(--border)}
.org-tree ul::before{content:"";position:absolute;top:0;left:50%;height:26px;border-left:2px solid var(--border)}
.org-card{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--border);background:var(--card);border-radius:12px;padding:8px 12px;cursor:pointer;min-width:150px;text-align:left;transition:.15s}
.org-card:hover{border-color:var(--teal);box-shadow:var(--shadow-md)}
.org-nm{font-weight:700;font-size:13.5px;line-height:1.15}
.org-rl{font-size:11.5px;color:var(--muted)}
.org-card.over{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-light)}
.org-card.dragging{opacity:.45}
.org-edit{margin-left:2px;border:1px solid var(--border);background:var(--card);color:var(--muted);border-radius:8px;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.org-edit:hover{color:var(--teal);border-color:var(--teal)}
.org-dropbar{margin:14px 0 4px;border:2px dashed transparent;border-radius:12px;padding:10px 14px;text-align:center;font-size:12.5px;color:var(--muted)}
.org-dropbar.armed{border-color:var(--border);background:var(--offwhite)}
.org-dropbar.over{border-color:var(--teal);background:var(--teal-light);color:var(--teal-ink);font-weight:600}
.modal{position:fixed;z-index:120;top:50%;left:50%;transform:translate(-50%,-50%);width:min(460px,92vw);background:var(--card);border-radius:16px;box-shadow:var(--shadow-lg);padding:22px}
.modal-h{font-size:16px;margin-bottom:10px;font-weight:600}
.modal p{font-size:13.5px;color:var(--mid);margin:0 0 14px;white-space:pre-wrap}
.org-print-head{display:none}
@media print{
  @page{size:landscape;margin:12mm}
  body{background:#fff !important}
  .sidebar,.topbar,.org-dropbar,.org-edit,.no-print,.scrim,.drawer,.modal,.toast,.org-notplaced,.page-head{display:none !important}
  .shell{display:block !important}

  var roster = await readHype(), target = normName(emp.fullName), existing = null;
  Object.keys(roster).forEach(function(k){ if(roster[k] && normName(roster[k].name) === target) existing = k; });

}

async function snapshotEmployees(list, reason){
  if(!PLAT.db || !list || list.length < 20) return false;
  var ts = String(Date.now()), emps = {};
  list.forEach(function(e){ if(e && e.employeeId){ var c = strip(e); c.photoUrl = ""; emps[e.employeeId] = c; } });
  await PLAT.db.doc(BKP + "/b" + ts).set({ ts: ts, at: new Date().toISOString(), reason: reason || "auto", count: list.length, employees: emps });
  var idx = await readBackupIndex();
  idx.unshift({ ts: ts, at: new Date().toISOString(), reason: reason || "auto", count: list.length });
  var drop = idx.slice(12); idx = idx.slice(0, 12);

/* Downscale a headshot to a small JPEG data URL so it fits on the record. */
function scaleImageToDataURL(file, maxDim, quality){
  return new Promise(function(resolve, reject){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      try{
        var w = img.naturalWidth, hh = img.naturalHeight, s = Math.min(1, maxDim / Math.max(w, hh));
        var c = document.createElement("canvas"); c.width = Math.round(w*s); c.height = Math.round(hh*s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url); resolve(c.toDataURL("image/jpeg", quality));
      }catch(e){ URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error("Couldn’t read that image")); };
    img.src = url;
  });
}

  var bdays = active.filter(function(e){return monthOf(e.personal&&e.personal.birthday)===mo;}).sort(function(a,b){return dayOf(a.personal.birthday)-dayOf(b.personal.birthday);});
  var anniv = active.filter(function(e){return monthOf(e.hireDate)===mo;}).sort(function(a,b){return dayOf(a.hireDate)-dayOf(b.hireDate);});
  var newHires = active.filter(function(e){return daysSince(e.hireDate)<=45;}).sort(function(a,b){return (b.hireDate||"").localeCompare(a.hireDate||"");});
